name: Create Pull Request to Repo B

on:
  push:
    branches:
      - 'dev-digital'

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code from Repository A
        uses: actions/checkout@v3

      - name: Set up Git (Repository A)
        run: |
          git config user.name "fork-akinobu"
          git config user.email "akinobu@fork.co.jp"

      - name: Set BRANCH_NAME
        run: echo "BRANCH_NAME=dev-digital-$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_ENV

      - name: Generate SSH key pair
        run: |
          ssh-keygen -t ed25519 -N "" -f repo_b_deploy_key

      - name: Clone Repo B
        uses: actions/checkout@v3
        with:
          repository: fork-akinobu/github-actions-test-2
          path: repositoryB
          token: ${{ secrets.REPO_B_TOKEN }}

      - name: Create Branch and Copy changes (Repo B)
        run: |
          cd repositoryB
          git config user.name "GitHub Actions Bot"  # 任意のユーザー名
          git config user.email "akinobu@fork.co.jp"  # 任意のメールアドレス
          git checkout -b ${{ env.BRANCH_NAME }}

          # 変更されたファイルのリストを取得 (git diff)
          # 最初のプッシュかどうかをチェック
          if [ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]; then
            # 最初のプッシュの場合、すべてのファイルを対象とする
            CHANGED_FILES=$(git ls-tree -r HEAD --name-only --relative)
          else
            # 最初のプッシュでない場合、通常の diff を実行
            CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT ${{ github.event.before }} ${{ github.sha }} --relative)
          fi

          # 変更されたファイルのみを rsync でコピー
          if [ -n "$CHANGED_FILES" ]; then  # 変更されたファイルがある場合のみ実行
            # --files-from=- で標準入力からファイルリストを読み込む
            # echo "$CHANGED_FILES" でファイルリストを標準入力に渡す
            # --from0 で NUL 文字区切りのファイルリストを扱う (ファイル名に空白などを含む場合のため)
            echo "$CHANGED_FILES" | rsync -av --progress --files-from=- --from0 -R --exclude='.git' ../ ./
          else
             echo "No changes detected." #変更がなかったときの処理
             exit 0 #正常終了させる
          fi

          #find ../ -mindepth 1 -maxdepth 1 -not -name 'github-actions-test-1' -exec cp -r {} . \;
          #rsync -av --progress --exclude='.git' ../ ./

          git add .
          git commit -m "Sync changes from Repo A"

      - name: Debug Environment Variables
        run: |
          echo "REPO_B_TOKEN starts with: ${REPO_B_TOKEN:0:10}"
          echo "REPO_B_TOKEN: ${{ secrets.REPO_B_TOKEN }}"
          echo "BRANCH_NAME: ${{ env.BRANCH_NAME }}"

      - name: Push changes to Repo B
        run: |
          cd repositoryB # リポジトリBのディレクトリに移動
          git remote -v
          git remote set-url origin https://x-access-token:${{ secrets.REPO_B_TOKEN }}@github.com/fork-akinobu/github-actions-test-2.git
          git remote -v
          if git push origin ${{ env.BRANCH_NAME }}; then
            echo "Push successful!"
          else
            echo "Push failed!"
            exit 1  # ワークフローを失敗させる
          fi

      - name: Create Pull Request in Repo B (using GitHub CLI) # より良い方法
        env:
          GH_TOKEN: ${{ secrets.REPO_B_TOKEN }}  # GitHub CLI で使うトークンを設定
        run: |
          cd repositoryB  # Repo B のディレクトリに移動
          gh pr create --base main --head ${{ env.BRANCH_NAME }} --title "Sync changes from Repo A - ${{ env.BRANCH_NAME }}" --body "This is an automated pull request created from Repo A."

      # - name: Create Pull Request in Repo B
      #   run: |
      #     PR_TITLE="Sync changes from Repo A - ${{ env.BRANCH_NAME }}"
      #     PR_BODY="This is an automated pull request created from Repo A."
      #     curl -X POST -H "Authorization: token ${{ secrets.REPO_B_TOKEN }}" \
      #          -d '{"title":"'"$PR_TITLE"'","head":"'${{ env.BRANCH_NAME }}'","base":"main","body":"'"$PR_BODY"'"}' \
      #          https://api.github.com/repos/fork-akinobu/github-actions-test-2/pulls # api urlを修正