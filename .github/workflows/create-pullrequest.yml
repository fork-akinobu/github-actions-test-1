name: Create Pull Request to Repo B

on:
  push:
    branches:
      - 'dev-digital'

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code from Repository A
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 完全なクローン

      - name: Set up Git (Repository A)
        run: |
          git config user.name "fork-akinobu"
          git config user.email "akinobu@fork.co.jp"

      - name: Set BRANCH_NAME
        run: echo "BRANCH_NAME=dev-digital-$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_ENV

      - name: Clone Repo B
        uses: actions/checkout@v3
        with:
          repository: fork-akinobu/github-actions-test-2
          path: repositoryB
          token: ${{ secrets.REPO_B_TOKEN }}

      - name: Create Branch and Copy changes (Repo B)
        run: |
          cd repositoryB
          git config user.name "GitHub Actions Bot"
          git config user.email "akinobu@fork.co.jp"
          git checkout -b ${{ env.BRANCH_NAME }}

          # --- (前のステップからの修正・デバッグコード) ---
          echo "github.event.before: ${{ github.event.before }}"
          echo "github.sha: ${{ github.sha }}"
          git log --oneline -n 5  # 直近の5コミットのログを表示

          if [ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]; then
            echo "Detected first push. Copying all files."
            CHANGED_FILES=$(git ls-tree -r HEAD --name-only --relative)
          else:
            echo "Detected normal push.  Calculating diff."
            git fetch --unshallow || true
            if git rev-parse --verify ${{ github.event.before }} > /dev/null 2>&1; then
                CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT ${{ github.event.before }} ${{ github.sha }} --relative)
            else
                echo "Previous commit (${{ github.event.before }}) not found.  Getting diff from the merge-base."
                CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT $(git merge-base ${{ github.event.before }} ${{ github.sha }}) ${{ github.sha }} --relative)
            fi
          fi

          if [ -n "$CHANGED_FILES" ]; then
            echo "Changed files:"
            echo "$CHANGED_FILES"
            echo "$CHANGED_FILES" | rsync -av --progress --files-from=- --from0 -R --exclude='.git' ../ ./
            if [ $? -ne 0 ]; then
              echo "rsync failed with exit code $?"
              exit 1
            fi
          else
            echo "No changes detected."
            exit 0
          fi
          # --- (前のステップからの修正・デバッグコード ここまで) ---

          # --- コミットが正しく行われたか確認 ---
          if ! git diff --quiet HEAD; then # HEAD に変更があるか確認
            git add .
            git commit -m "Sync changes from Repo A"
          else
            echo "No changes to commit after rsync."
            exit 0  # 変更がない場合はここで終了 (プルリクエストを作成しない)
          fi
          # --- コミット確認ここまで ---


      - name: Push changes to Repo B (with error handling)
        run: |
          cd repositoryB
          git remote set-url origin "https://x-access-token:${{ secrets.REPO_B_TOKEN }}@github.com/fork-akinobu/github-actions-test-2.git"
          if git push origin ${{ env.BRANCH_NAME }}; then
            echo "Push successful!"
          else:
            echo "Push failed!"
            exit 1
          fi

      - name: Create Pull Request in Repo B (using GitHub CLI and error handling)
        env:
          GH_TOKEN: ${{ secrets.REPO_B_TOKEN }}
        run: |
          cd repositoryB

          # mainブランチの存在確認
          if git branch -r | grep -q "origin/main"; then # リモートにmainがあるか
            echo "main branch exists."
          else
            echo "Error: main branch does not exist in Repo B."
            exit 1 # main が存在しないのでエラー終了
          fi

          # --- プルリクエスト作成 (エラーハンドリング付き) ---
          if gh pr create --base main --head ${{ env.BRANCH_NAME }} --title "Sync changes from Repo A - ${{ env.BRANCH_NAME }}" --body "This is an automated pull request created from Repo A."; then
             echo "Pull request created successfully!"
          else
             echo "Pull request creation failed."
             exit 1
          fi
          # --- プルリクエスト作成 ここまで ---